[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopee-video-studio"
version = "0.1.0"
description = "Esteira orquestrada de produção de vídeos de produto para Shopee Vídeo (referências oficiais → imagem aprovada → animação → montagem)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
real = ["google-genai>=2.30", "httpx>=0.27"]  # httpx: cliente do motor fal.ai (ja vem com o google-genai)
chat = ["anthropic"]  # conversa com os agentes (Fase 6); sem ele a conversa fica no modo "sem IA"
dev = ["pytest>=8"]

[project.scripts]
studio = "studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studio = ["web/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real: integração real com provedores pagos (desligada por padrão)",
    "ffmpeg: exige FFmpeg instalado",
]
addopts = "-m 'not real'"
