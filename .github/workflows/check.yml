# CI do staging: backend, frontend, arquivos licenciados e segredos.
# Nada aqui usa segredo nem os assets licenciados (pacote privado): roda igual em PR de fork. A conferência das folhas
# reais dos personagens (frontend/tests/sprite-layout.test.mjs) pula sem assets/characters/ e roda só a parte sintética.
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend no Linux/Python 3.12 com as versões e hashes do lockfile; testes `real` (provedores pagos) ficam fora.
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg e fonte (testes de vídeo)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - name: dependências do lockfile (com hashes)
        run: |
          python -m pip install --require-hashes -r docker/requirements.lock
          python -m pip install pytest==9.2.0
      - name: pytest (sem testes reais)
        run: PYTHONPATH=src python -m pytest -q -m "not real"
      - name: pip-audit dos lockfiles (venv separado, sem resolver de novo)
        run: |
          python -m venv "$RUNNER_TEMP/audit"
          "$RUNNER_TEMP/audit/bin/python" -m pip install pip-audit==2.10.1
          "$RUNNER_TEMP/audit/bin/pip-audit" -r docker/requirements.lock --require-hashes --disable-pip --progress-spinner off
          "$RUNNER_TEMP/audit/bin/pip-audit" -r docker/requirements-assets.lock --require-hashes --disable-pip --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:brand
      - run: npm run build
      - name: npm audit (dependências de produção)
        run: npm audit --omit=dev

  # Nenhuma arte licenciada, foto pessoal, ZIP ou dado de execução pode estar rastreado pelo Git.
  licensed-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_licensed_files.py

  # Segredos no histórico inteiro (imagem oficial do gitleaks, sem licença nem token). Saída com valores mascarados.
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks git
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$GITHUB_WORKSPACE:/repo"
          ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
