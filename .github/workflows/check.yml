# Checagens rápidas do frontend: guard da marca (check:brand), testes node e build.
name: check
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
  # Nenhuma arte licenciada, foto pessoal, ZIP ou dado de execução pode estar rastreado pelo Git.
  licensed-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_licensed_files.py
  # Backend no Linux/Python 3.12 com as versões do lockfile (testes não reais; sem ffmpeg os marcados `ffmpeg` pulam ou falham conforme o teste).
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pip install --require-hashes -r docker/requirements.lock && pip install pytest
      - run: PYTHONPATH=src python -m pytest -q
