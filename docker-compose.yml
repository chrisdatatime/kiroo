# Teste local da imagem Kiroo. Veja docs/DOCKER.md.
#
# Credenciais de LEITURA do R2: exporte no terminal (nunca em arquivo versionado nem no chat):
#   R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY
# Elas só existem durante `docker compose build` (BuildKit secrets) e não vão ao runtime.
name: kiroo

services:
  kiroo:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-desconhecido}   # commit de origem (rotulo da imagem); nao e segredo
      secrets:
        - r2_account_id
        - r2_access_key_id
        - r2_secret_access_key
    image: kiroo:local
    init: true
    ports:
      - "127.0.0.1:${KIROO_PORT:-8765}:8765"
    # Configuração de runtime (sem credenciais do R2). Opcional: copie .env.docker.example para .env.docker.
    env_file:
      - path: .env.docker
        required: false
    # Backup (docs/BACKUP.md): repassadas do terminal SE existirem; nunca gravadas em arquivo.
    environment:
      - STUDIO_ENV
      - BACKUP_R2_ENDPOINT
      - BACKUP_R2_ACCESS_KEY_ID
      - BACKUP_R2_SECRET_ACCESS_KEY
      - BACKUP_BUCKET
      # Prazo SIGTERM -> SIGKILL que a plataforma dá; IGUAL ao stop_grace_period abaixo. O servidor recusa subir se
      # STUDIO_SHUTDOWN_GRACE_S + 2 (HTTP) + STUDIO_SHUTDOWN_SETTLE_S + 5 (Litestream) passar disso (docs/RUNBOOK.md).
      - STUDIO_STOP_GRACE_S=40
    volumes:
      - kiroo-data:/data                       # banco, produções, uploads (persistente)
      - ./reference:/reference:ro              # referência pessoal: ./reference/bia/PERFIL BIA.jpg (opcional)
    stop_grace_period: 40s                     # >= grace 25 + HTTP 2 + settle 3 + Litestream 5 = 35 (STUDIO_STOP_GRACE_S)
    restart: unless-stopped

secrets:
  r2_account_id:
    environment: R2_ACCOUNT_ID
  r2_access_key_id:
    environment: R2_ACCESS_KEY_ID
  r2_secret_access_key:
    environment: R2_SECRET_ACCESS_KEY

volumes:
  kiroo-data:
