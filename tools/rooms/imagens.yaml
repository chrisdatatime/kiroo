# Sala de Imagens (Iris) — 10x8, só Room_Builder_Office + Modern_Office. Identidade: MENTA, duas estações bege, impressora, plantas e arte colorida.
# Piso útil 8x4. Duas estações na parede norte (colunas 1-3 e 6-8, mesa 3x3 sobre a base da parede, cadeira nas linhas 4-5);
# entre elas o vão da porta (colunas 4-5) com impressora, planta e o quadro grande na parede.
id: imagens
nome: Imagens
agent: iris
tab: imagens
size: [10, 8]
floor: sala_menta

seats:
  - { at: [2, 5], face: down, kind: agent, monitor: true }     # estação A: Iris
  - { at: [7, 5], face: down, kind: visitor, monitor: true }   # estação B
monitor: [1, 2, 8, 2]
entry: [4, 5]
spots: [[3, 5], [5, 5], [6, 5]]

grid: |
  FFFFFFFFFF
  BBBBBBBBBB
  L........R
  L........R
  L........R
  L........R
  FFFF..FFFF
  BBBB..BBBB

objects:
  # estação A
  - { use: desk_light,      at: [1, 1] }
  - { use: monitor_modern,  at: [2, 2] }
  - { use: phone,           at: [1, 2] }
  - { use: keyboard,        at: [2, 3] }
  - { use: chair_swivel,    at: [2, 4] }
  # estação B
  - { use: desk_light,      at: [6, 1] }
  - { use: monitor_modern,  at: [7, 2] }
  - { use: desk_lamp,       at: [8, 2] }
  - { use: keyboard,        at: [7, 3] }
  - { use: chair_swivel,    at: [7, 4] }
  # vão central: impressora e planta
  - { use: printer,         at: [5, 3] }
  - { use: plant_small,     at: [4, 2] }
  # cantos
  - { use: plant_small,     at: [1, 4] }
  - { use: plant_small,     at: [8, 4] }
  # parede norte
  - { use: frame_face_a,    at: [1, 0] }
  - { use: frame_mini,      at: [3, 0] }
  - { use: art_pop,         at: [4, 0] }
  - { use: frame_face_b,    at: [6, 0] }
  - { use: frame_mini,      at: [8, 0] }
