# Sala de Edição (SPEC-VIS-001) — 10x9 tiles (externo), só Room_Builder_Office + Modern_Office + piso do Room_Builder.
#
# grid, um caractere por tile (tabela em tools/tiles.yaml, walls):
#   F / B = parede horizontal: topo com tampa + face / face baixa com rodapé (2 tiles de face)
#   L / R = faixa lateral esquerda / direita      . = chão (os vãos de porta são chão em F/B)
# Piso útil: 8x5. Duas estações (mesa 3x3 + cadeira 1x2 sobreposta à frente da mesa), estante, planta e quadros.
# Porta a oeste (linhas 5-6), para o corredor vertical; a fileira 5 fica livre para andar atrás das cadeiras.

id: edicao
nome: Edição
agent: beto          # agente da sala (game/data.js); liga o retângulo room ao setor e ao estado
tab: entrega
size: [10, 9]
# origem vem de tools/layout.yaml (célula C3)
floor: sala_amarelo

# Fase 2 — objetos de jogo (coordenadas da sala, como os móveis):
#   seats: assento = célula de baixo da cadeira (a que colide). kind agent|visitor|free; monitor: sentado aqui usa o monitor
#   monitor: retângulo [x, y, w, h] das mesas que abrem o trabalho da sala
#   entry: onde o "Ir para a sala" deixa o jogador · spawn: início do jogo (só uma sala define) · spots: passeio dos agentes
seats:
  - { at: [2, 6], face: down, kind: agent, monitor: true }     # estação A: Beto
  - { at: [5, 6], face: down, kind: visitor, monitor: true }   # estação B
monitor: [1, 2, 6, 3]
entry: [1, 5]
spots: [[3, 5], [6, 5], [8, 5]]

grid: |
  FFFFFFFFFF
  BBBBBBBBBB
  L........R
  L........R
  L........R
  .........R
  .........R
  FFFFFFFFFF
  BBBBBBBBBB

objects:
  # estação A
  - { use: desk_office,     at: [1, 2] }
  - { use: phone,           at: [1, 3] }
  - { use: monitor_modern,  at: [2, 3] }
  - { use: keyboard,        at: [2, 4] }
  - { use: chair_swivel,    at: [2, 5] }
  # estação B
  - { use: desk_office,     at: [4, 2] }
  - { use: monitor_modern,  at: [5, 3] }
  - { use: keyboard,        at: [5, 4] }
  - { use: chair_swivel,    at: [5, 5] }
  - { use: desk_lamp,       at: [6, 3] }

  # parede norte: quadro branco, quadros e estante
  - { use: whiteboard_chart, at: [1, 0] }
  - { use: poster,           at: [3, 0] }
  - { use: whiteboard,       at: [4, 0] }
  - { use: poster,           at: [6, 0] }
  - { use: shelf,            at: [7, 0] }

  # canto leste
  - { use: plant_small,     at: [8, 3] }
  - { use: printer,         at: [7, 5] }
