# Sala de Vídeos (Lia) — 10x9, só Room_Builder_Office + Modern_Office. Identidade: ESTÚDIO — racks, rig de câmera com softbox
# e monitores, tela tripla na mesa da Lia. Piso útil 8x5 (colunas 1-8, linhas 2-6). Porta a oeste (linhas 3-4).
# Mesa na parede norte (colunas 5-7, linha 2) com cadeira nas linhas 5-6, como na Edição.
id: videos
nome: Vídeos
agent: lia
tab: videos
size: [10, 9]
floor: sala_rosa

seats:
  - { at: [6, 6], face: down, kind: agent, monitor: true }     # mesa da Lia
  - { at: [7, 6], face: down, kind: visitor, monitor: true }   # cadeira de visita ao lado da Lia
monitor: [5, 2, 3, 3]
entry: [1, 3]
spots: [[4, 4], [5, 6], [3, 6]]

grid: |
  FFFFFFFFFF
  BBBBBBBBBB
  L........R
  .........R
  .........R
  L........R
  L........R
  FFFFFFFFFF
  BBBBBBBBBB

objects:
  # racks na parede norte
  - { use: rack_a,          at: [1, 0] }
  - { use: rack_b,          at: [3, 0] }
  # mesa da Lia com tela tripla
  - { use: desk_dark,       at: [5, 2] }
  - { use: monitor_triple,  at: [5, 3] }
  - { use: keyboard,        at: [6, 4] }
  - { use: chair_swivel,    at: [6, 5] }
  - { use: chair_swivel,    at: [7, 5] }      # visita
  # área de gravação
  - { use: studio_rig,      at: [1, 4] }
  - { use: plant,           at: [8, 3] }
  # parede norte, acima da mesa
  - { use: art_pop,         at: [6, 0] }
  - { use: frame_mini,      at: [5, 0] }
