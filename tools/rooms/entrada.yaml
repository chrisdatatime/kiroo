# Entrada (recepção) — 10x9, Room_Builder_Office + Modern_Office + sofá/poltrona do Interiors. Identidade: bege acolhedor.
# Piso útil 8x5 (colunas 1-8, linhas 2-6). Porta ao norte (colunas 4-5): de cada lado, sofá de espera e quadro de avisos.
# O spawn (5,3) e a passagem da porta até ele ficam livres. Balcão de recepção na parte de baixo, planta e poltrona nas bordas.
id: entrada
nome: Entrada
size: [10, 9]
floor: sala_bege

entry: [4, 2]
spawn: [5, 3]

grid: |
  FFFF..FFFF
  BBBB..BBBB
  L........R
  L........R
  L........R
  L........R
  L........R
  FFFFFFFFFF
  BBBBBBBBBB

objects:
  # sala de espera (esquerda): sofá azul-acinzentado + poltrona, quadro acima
  - { use: sofa_blue,       at: [1, 1], seats: [1] }   # só o lugar da direita: o da esquerda fica entre a parede e a poltrona
  - { use: armchair_blue,   at: [1, 3] }
  - { use: frame_face_a,    at: [2, 0] }
  # quadro de avisos (direita) + poster
  - { use: whiteboard_chart, at: [6, 0] }
  - { use: poster,          at: [8, 0] }
  - { use: plant_small,     at: [8, 2] }
  # balcão de recepção (mesa comprida lavanda com monitor, telefone e luminária)
  - { use: table_lav_long,  at: [4, 4] }
  - { use: monitor_modern,  at: [5, 5] }
  - { use: phone,           at: [7, 5] }
  - { use: desk_lamp,       at: [4, 5] }
  - { use: plant_small,     at: [1, 5] }
