# Vocabulário de tiles do Pivoo (SPEC-VIS-001, Fase 1).
# Tileset: Modern Interiors by LimeZu — https://limezu.itch.io/moderninteriors
#
# GID = firstgid + linha*colunas + coluna. Os firstgid têm de bater com assets/maps/office.tmx.
# Nada aqui é adivinhado: cada GID foi lido nos catálogos de tools/out/ (veja catalog.md).

map:
  width: 30
  height: 20
  tile: 32

tilesets:
  room_builder: { firstgid: 1, columns: 76, source: ../tilesets/Room_Builder_32x32.png, name: Room_Builder_32x32,
                  image_width: 2432, image_height: 3616, tilecount: 8588 }
  interiors: { firstgid: 8589, columns: 16, source: ../tilesets/Interiors_32x32.png, name: Interiors_32x32,
               image_width: 512, image_height: 34048, tilecount: 17024 }
  modern_office: { firstgid: 25613, columns: 16, source: ../tilesets/Modern_Office_32x32.png, name: Modern_Office_32x32,
                   image_width: 512, image_height: 1696, tilecount: 848 }
  room_builder_office: { firstgid: 26461, columns: 16, source: ../tilesets/Room_Builder_Office_32x32.png,
                         name: Room_Builder_Office_32x32, image_width: 512, image_height: 448, tilecount: 224 }

# --- chão (Room_Builder_Office) ------------------------------------------------------------------
floors:
  piso_escritorio: [26584]                # cinza-escuro texturizado, col 11 lin 7 (1 variante só, evita mancha)
  piso_cinza: [1188]                      # legado (Room_Builder)

# --- parede (Room_Builder_Office, linhas 0-6) -----------------------------------------------------
# Parede norte = 2 fileiras: F (topo com tampa branca + face) e B (face baixa + rodapé).
# Pontas/meio escolhidas pelos vizinhos. O resto é TABELA EXPLÍCITA char -> GID:
#   L / R  faixa lateral própria (col 7 / col 9, lin 2)   S  barra sul (col 8, lin 3)
#   <  / > cantos sul (col 7 / 9, lin 3)                  ( / ) batentes da porta (col 4 / 3, lin 3)
walls:
  face: { esq: 26541, meio: 26542, dir: 26543, unico: 26542 }   # lin 5
  base: { esq: 26557, meio: 26558, dir: 26560, unico: 26558 }   # lin 6
  explicit: { L: 26500, R: 26502, S: 26517, "<": 26516, ">": 26518, "(": 26513, ")": 26512 }

# --- objetos do escritório (Modern_Office) --------------------------------------------------------
# set + rect [coluna, linha, largura, altura]: o GID sai de 25613 + linha*16 + coluna e tiles totalmente
# transparentes são ignorados. Cada retângulo foi conferido no recorte ampliado com grade.
# collision: células (dx, dy) que bloqueiam; layer: below (atrás do jogador) ou above (na frente).
# sort: true = móvel em pé; vai para a camada de objetos furniture_sorted e o Phaser ordena pelo pé (y-sorting).
office:
  desk_office:                             # mesa bege-trama 3x3 (col 1-3, lin 0-2)
    layer: below
    sort: true                             # em pé: sprite próprio, depth = y do pé (Fase 2)
    set: modern_office
    rect: [1, 0, 3, 3]
    collision: [[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]]

  chair_swivel:                            # cadeira de encosto alto vista de frente, 1x2 (col 2, lin 8-9)
    layer: below
    sort: true                             # em pé: sprite próprio, depth = y do pé (Fase 2)
    set: modern_office
    rect: [2, 8, 1, 2]
    collision: [[0,1]]

  monitor_modern:                          # monitor de frente com tela azul, 1x1 (col 14, lin 12)
    layer: above
    set: modern_office
    rect: [14, 12, 1, 1]
    collision: []

  keyboard:                                # teclado + mouse, 1x1 (col 14, lin 14)
